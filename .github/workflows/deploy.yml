name: Deploy

# Producción (EC2 pallevar-backend) construye las imágenes en el propio servidor con
# docker compose desde /opt/pallevar; aquí solo se sube el código y se reconstruye backoffice.
on:
  push:
    branches:
      - main

concurrency:
  group: deploy-backoffice
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_KEY }}

      - name: Upload source
        run: |
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts
          tar --exclude=.git --exclude=node_modules --exclude=vendor -cf - .             | ssh "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" "tar xf - -C /opt/pallevar/backoffice"

      - name: Build and restart
        run: |
          ssh "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" 'bash -s' <<'EOF'
            set -e
            cd /opt/pallevar
            docker compose build backoffice
            docker compose up -d --no-deps backoffice
            sleep 15
            docker compose ps backoffice
            docker image prune -f
            echo "Deploy done!"
          EOF
